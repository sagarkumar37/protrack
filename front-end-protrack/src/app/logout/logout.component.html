<!-- chatgpt -->
<div class="log-out">
  <div class="header">
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <div class="logo"><img src="assets/img/logo.png" height="250" width="200"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="logout-page" style="background-color: #f3f3f3c4;">
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <div class="row">
            <div class="col-md-3 calendar">
              <form [formGroup]="dateForm">
                <mat-form-field appearance="fill">
                  <mat-label>Choose a date</mat-label>
                  <input matInput [matDatepicker]="picker" formControlName="date" [max]="maxDate">
                  <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                  <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
              </form>
            </div>
            <div class="col-md-9 note-head">
              <h4>Kindly ensure you fill your timesheet
              </h4>
            </div>
          </div>
        </div>
        <div class="col-md-12">
          <div class="table-responsive tablenw">
            <table>
              <tbody>
                <tr>
                  <th>Description</th>
                  <th>Time(Min)</th>
                  <th>Activity</th>
                  <th>&nbsp;</th>
                </tr>
                <tr *ngFor="let input of inputs; let i = index">
                  <td>
                    <input class="form-control" placeholder="Enter Activity Description"
                           [(ngModel)]="input.description" (ngModelChange)="onInputChange(i, 'description', $event)"
                           required>
                  </td>
                  <td>
                    <input class="form-control" [(ngModel)]="input.effort_placed"
                           placeholder="Enter time in minutes" (ngModelChange)="onInputChange(i, 'time', $event)"
                           type="number" min="0" max="1440" required>
                  </td>
                  <td>
                    <input type="text" 
                           class="form-control1 plain-input"
                           placeholder="Please Search and Select Activity" 
                           [(ngModel)]="input.activity" 
                           name="stateGroup{{i}}" 
                           required 
                           (ngModelChange)="filterActivities($event)" 
                           [matAutocomplete]="autoGroup">
                           
                    <mat-autocomplete #autoGroup="matAutocomplete" (optionSelected)="onOptionSelected(i, $event)">
                      <mat-optgroup *ngFor="let group of filteredOptions" [label]="group.letter">
                        <mat-option *ngFor="let name of group.names" [value]="name">{{ name }}</mat-option>
                      </mat-optgroup>
                    </mat-autocomplete>
                  </td>
                  <td align="center">
                    <button class="btn btn-secondary" (click)="addInput()" [disabled]="inputs.length === 15 || !isValidInput()">
                      <i class="fa fa-plus" aria-hidden="true"></i>
                    </button>
                    <button type="reset" (click)="removeInput(i)" class="btn btn-outline-secondary">
                      <i class="fa fa-times" aria-hidden="true"></i>
                    </button>
                  </td>
                </tr>
                
              </tbody>
            </table>
        </div>
      </div>
    </div>
    <div class="col-md-12">
      <div class="logout-inner">
        <div class="row">

          <!-- <div class="col-md-3">
          <div class="form-group">
            <label>Total Time Usage:</label>
            <div class="form-control" >{{totalTime}}</div>
          </div> 
        </div> -->
          <div class="col-md-4">
            <div class="form-group">
              <label>Total Time Calculated:</label>
              <div class="form-control">
                {{totalTime}}
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label>Remaining Time:</label>
              <div class="form-control">{{totalMinInOneDay-totalTime}}</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label>&nbsp;</label>
              <button class="btn btn-outline-primary" (click)="saveInputs()">Save</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
