
<div class="queryRefresh"> 
    <button class="btn" type="button" title="Query Refresh" (click)="queryRefreshData()">
        <svg  xmlns="http://www.w3.org/2000/svg"  width="18"  height="18"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class=""><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" /><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" /></svg>
        Refresh</button> 
    <!-- <button class="btn " type="button" title="Reload" (click)="reloadPage()"><svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class=""><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M19.933 13.041a8 8 0 1 1 -9.925 -8.788c3.899 -1 7.935 1.007 9.425 4.747" /><path d="M20 4v5h-5" /></svg>Reload</button>  -->
    <div *ngIf="isLoading" class="loader-container">
        <img src="../../assets/img/wave-color.gif">
    </div>
</div>
<iframe width="100%" [ngClass]="isLoading ? 'loader_color' : ''" class="iframeheight" frameBorder="0" [src]="redashUrl"></iframe>
