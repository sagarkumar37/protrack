<div class="container">
    <h2>Assign Max Leave For Employee</h2>
  
    <form #assignedLeaveForm="ngForm" (ngSubmit)="onSubmit(assignedLeaveForm)">
      
      <!-- Employee Dropdown (Visible only for Admin) -->
      <div class="form-group">
        <label for="employee">Employee:</label>
        <select id="employee" [(ngModel)]="selectedEmployeeId" (change)="onEmployeeSelected()" name="employee_id" required class="form-control">
          <option value="" disabled selected>Select Employee</option>
          <option *ngFor="let emp of employeeList" [value]="emp.id">
            {{ emp.username }}
          </option>
        </select>
      </div>
  
      <!-- Leave Type Dropdown -->
      <div class="form-group">
        <label for="leaveType">Leave Type:</label>
        <select id="leaveType" [(ngModel)]="selectedLeaveType" name="leave_type_id" required class="form-control">
          <option value="" disabled selected>Select Leave Type</option>
          <option *ngFor="let leave of leaveTypes" [ngValue]="leave.leave_type_id">
            {{ leave?.leave_type_name || 'Unnamed Leave' }}
          </option>
        </select>
      </div>
  
      <!-- Max Leaves -->
      <div class="form-group">
        <label for="max_leaves">Max Leaves</label>
        <input type="number" id="max_leaves" (keydown)="preventE($event)" 
            [(ngModel)]="maxLeaves" name="max_leaves" class="form-control" required />
      </div>
  
      <button type="submit" class="btn btn-primary" [disabled]="!assignedLeaveForm.valid">
        Submit
      </button>
    </form>
  
    <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>
  </div>
